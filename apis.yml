name: Obvio
description: 'Obvio is an AI-powered traffic-safety platform that helps cities and police departments
  detect and enforce reckless driving. Its context-aware computer-vision cameras identify stop-sign
  violations, crosswalk failures, school-zone speeding, and distracted driving, then support law
  enforcement in reducing infractions and improving road safety. Obvio is a physical-AI company
  deployed with police departments in Maryland and expanding into new states; it is backed by Bain
  Capital Ventures, Homebrew, and Khosla Ventures. Added to the API Evangelist network from a VC
  portfolio lead; no public API or developer surface is currently published.'
